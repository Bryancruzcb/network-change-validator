[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-change-validator"
version = "0.1.0"
description = "Intent-based pre/post network change validator (fixture CI, optional lab)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bryan Cruz" }]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
lab = ["pyats[full]"]

[project.scripts]
ncv = "ncv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["output", "captures"]

[tool.ruff.lint]
# F catches the unused imports this project kept accumulating in tests;
# I keeps import blocks ordered; E/UP/B/SIM are the conservative defaults.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
