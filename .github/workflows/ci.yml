name: ci
on:
  push:
  pull_request:
jobs:
  test:
    name: ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: python -m pip install -e ".[dev]"
      - name: ruff lint
        run: python -m ruff check .
      - name: ruff format
        run: python -m ruff format --check .
      - name: pytest
        run: python -m pytest
      - name: confirm optional dependencies are absent
        run: |
          python -c "import importlib.util; assert all(importlib.util.find_spec(p) is None for p in ('pyats', 'genie'))"
      - name: fixture diff (expected findings)
        shell: bash
        run: |
          status=0
          python -m ncv diff fixtures/pre fixtures/post --intent intents/demo.yaml --report output/ci || status=$?
          test "$status" -eq 1
      - name: clean fixture pair
        run: python -m ncv diff fixtures/pre fixtures/pre --intent intents/demo.yaml --report output/clean
