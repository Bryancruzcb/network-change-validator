# Draft intent for the second-platform run (scripts/lab/run-second-platform.sh nxosv9000), with
# R3 an NX-OS 9000v. It was written before any capture of this platform exists, and it moves
# next to its evidence under fixtures/ once a run is recorded.
#
# docs/LIVE.md's rule is to write an intent from the pre capture. This one could not be: R3's
# strings are taken from Genie's NX-OS test data and parsers, not from a device. Expect to
# correct them after the first pre capture; the no-change check is what will say so, naming the
# rule whose string the capture does not hold. The strings are NX-OS's own, copied as Genie
# writes them: R3's connected route is `direct`, not `connected`, and its first data port is
# Ethernet1/1. intent-second-platform-cat8000v.yaml, beside this file, and
# fixtures/lab-2026-11-21/intent-second-platform-iosv.yaml differ from it only in those two
# strings.
#
# R1 peers with R3 over the link on R1 Ethernet0/3 (10.1.3.0/24): OSPF in area 0, with R3's
# Loopback0 3.3.3.3/32 learned through it, and eBGP from AS 65001 to AS 65003, with R3's
# Loopback1 network 172.16.3.0/24 learned through it. R3 learns R1's 1.1.1.0/24 over OSPF and
# R1's 10.10.10.0/24 over BGP. R2 is captured too but no rule names it. The required lines on R1
# prove the link and the session are configured; for R3 only `router bgp 65003` is required,
# since NX-OS writes its configuration differently and no capture exists to copy lines from.
# The change (`shutdown` on R1 Ethernet0/3) is deliberately not named here.
intent_id: devnet-default-lab-second-platform
version: 1

devices:
  - R1
  - R3

adjacencies:
  - device: R1
    protocol: ospf
    neighbor: 3.3.3.3
    interface: Ethernet0/3
  - device: R3
    protocol: ospf
    neighbor: 1.1.1.1
    interface: Ethernet1/1
  - device: R1
    protocol: bgp
    neighbor: 10.1.3.3
    vrf: default
    remote_as: 65003
  - device: R3
    protocol: bgp
    neighbor: 10.1.3.1
    vrf: default
    remote_as: 65001

routes:
  - device: R1
    vrf: default
    prefix: 10.1.3.0/24
    protocol: connected
  - device: R1
    vrf: default
    prefix: 3.3.3.3/32
    protocol: ospf
  - device: R1
    vrf: default
    prefix: 172.16.3.0/24
    protocol: bgp
  - device: R3
    vrf: default
    prefix: 10.1.3.0/24
    protocol: direct
  - device: R3
    vrf: default
    prefix: 1.1.1.0/24
    protocol: ospf
  - device: R3
    vrf: default
    prefix: 10.10.10.0/24
    protocol: bgp

interfaces:
  - device: R1
    name: Ethernet0/3
    max_in_errors: 0
    max_crc: 0
  - device: R3
    name: Ethernet1/1
    max_in_errors: 0
    max_crc: 0

config:
  must_include:
    - device: R1
      lines:
        - "ip address 10.1.3.1 255.255.255.0"
        - "network 10.1.3.0 0.0.0.255 area 0"
        - "neighbor 10.1.3.3 remote-as 65003"
        - "neighbor 10.1.3.3 timers 3 9"
    - device: R3
      lines:
        - "router bgp 65003"
